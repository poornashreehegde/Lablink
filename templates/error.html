{% extends 'base.html' %}

{% block title %}{{ code }} - {{ title }} — LabLink{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto py-16 text-center space-y-6">
    <div class="w-16 h-16 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto text-2xl font-bold font-mono">
        {{ code }}
    </div>

    <div class="space-y-2">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">{{ title }}</h1>
        <p class="text-xs sm:text-sm text-slate-400 leading-relaxed">{{ message }}</p>
    </div>

    <div class="pt-4 flex items-center justify-center gap-3">
        <a href="{{ url_for('index') }}" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2">
            <i data-lucide="home" class="w-4 h-4"></i>
            <span>Return to Catalog</span>
        </a>
        {% if not current_user %}
            <a href="{{ url_for('login') }}" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition-colors">
                Sign In
            </a>
        {% endif %}
    </div>
</div>
{% endblock %}
