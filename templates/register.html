{% extends 'base.html' %}

{% block title %}Student Registration — LabLink{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-8 space-y-6">

    <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white mx-auto shadow-lg shadow-indigo-600/30">
            <i data-lucide="user-plus" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Create Student Account</h1>
        <p class="text-xs text-slate-400">Register to request and access specialized university laboratory workstations</p>
    </div>

    <!-- Registration Form -->
    <form method="POST" action="{{ url_for('register') }}" class="glass-card rounded-3xl p-6 md:p-8 space-y-4 shadow-2xl">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Username</label>
                <input type="text" name="username" required placeholder="e.g. maya.d" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Roll / Student ID</label>
                <input type="text" name="student_id" required placeholder="e.g. 2024-CS-045" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 font-mono">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Full Name</label>
            <input type="text" name="full_name" required placeholder="e.g. Maya Deshmukh" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Campus Email</label>
            <input type="email" name="email" required placeholder="student@campus.edu" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Academic Department</label>
            <select name="department" required class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500">
                {% for d in departments %}
                    <option value="{{ d.name }}">{{ d.name }} ({{ d.code }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Password</label>
                <input type="password" name="password" minlength="8" required placeholder="Min 8 characters" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" minlength="8" required placeholder="Re-enter password" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                <span>Create Student Account</span>
                <i data-lucide="check" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="text-center pt-2 text-xs text-slate-400">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-indigo-400 font-semibold hover:underline">Sign in</a>
        </div>
    </form>

</div>
{% endblock %}
